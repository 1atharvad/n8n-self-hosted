image: python:3.11

definitions:
  steps:
    - step: &lint-frontend
        name: Lint frontend
        image: node:20
        caches:
          - node
        script:
          - cd admin-api/frontend
          - npm ci
          - npm run lint

    - step: &lint-api
        name: Lint API
        script:
          - pip install --quiet black==25.9.0 isort==9.0.1 ruff==0.14.2
          - cd api
          - python -m isort --check .
          - python -m black --check .
          - python -m ruff check .

    - step: &test
        name: Test
        image: node:20
        caches:
          - node
        script:
          - npm ci
          - npm test

    - step: &write-ssh-key
        name: Write SSH key
        script:
          - mkdir -p ~/.ssh
          - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'

    - step: &deploy
        name: Deploy
        deployment: production
        script:
          - |
            CHANGED=$(git diff --name-only ${BITBUCKET_COMMIT}^..${BITBUCKET_COMMIT} 2>/dev/null || git diff --name-only HEAD~1..HEAD)
            if ! echo "$CHANGED" | grep -qv '^n8n-workflows/'; then
              WORKFLOWS_ONLY=true
            else
              WORKFLOWS_ONLY=false
            fi
            echo "WORKFLOWS_ONLY=$WORKFLOWS_ONLY" >> pipeline.env
          - pip install --quiet ansible
          - mkdir -p ~/.ssh
          - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'
          - |
            export ANSIBLE_CONFIG=ansible/ansible.cfg
            source pipeline.env
            WORKER_IP="$(echo "${CONTABO_WORKER_IP}" | xargs)"
            if [ "$WORKFLOWS_ONLY" = "true" ]; then
              echo "=== Only n8n-workflows/ changed — skipping deploy ==="
              exit 0
            fi
            echo "=== CONTABO_WORKER_IP='${CONTABO_WORKER_IP}' trimmed='${WORKER_IP}' ==="
            if [ -z "$WORKER_IP" ]; then
              echo "=== Single-server deploy ==="
              ansible-playbook -i ansible/inventory/single.yml ansible/playbooks/deploy_main.yml \
                -e "full_deploy=true" -e "services="
            else
              echo "=== Multi-server deploy (workers: ${WORKER_IP}) ==="
              bash sh_files/gen_workers_inventory.sh
              ansible-playbook -i ansible/inventory/multi/main.yml ansible/playbooks/deploy_main.yml \
                -e "full_deploy=true" -e "services="
              ansible-playbook -i ansible/inventory/multi/workers_dynamic.yml ansible/playbooks/deploy_workers.yml \
                -e "full_deploy=true" -e "worker_services="
            fi

pipelines:
  branches:
    devn8nversion2:
      - step: *lint-frontend
      - step: *lint-api
      - step: *test
      - step: *deploy

  custom:
    setup-single:
      - step:
          name: Provision single server
          deployment: production
          script:
            - pip install --quiet ansible
            - mkdir -p ~/.ssh
            - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'
            - export ANSIBLE_CONFIG=ansible/ansible.cfg
            - CI_SSH_PUBKEY="$(ssh-keygen -y -f ~/.ssh/id_ed25519)" ansible-playbook -i ansible/inventory/single.yml ansible/playbooks/setup.yml

    setup-multi:
      - step:
          name: Provision main server
          deployment: production
          script:
            - pip install --quiet ansible
            - mkdir -p ~/.ssh
            - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'
            - export ANSIBLE_CONFIG=ansible/ansible.cfg
            - CI_SSH_PUBKEY="$(ssh-keygen -y -f ~/.ssh/id_ed25519)" ansible-playbook -i ansible/inventory/multi/main.yml ansible/playbooks/setup.yml
      - step:
          name: Provision worker servers
          deployment: production
          script:
            - pip install --quiet ansible
            - mkdir -p ~/.ssh
            - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'
            - export ANSIBLE_CONFIG=ansible/ansible.cfg
            - bash sh_files/gen_workers_inventory.sh
            - CI_SSH_PUBKEY="$(ssh-keygen -y -f ~/.ssh/id_ed25519)" ansible-playbook -i ansible/inventory/multi/workers_dynamic.yml ansible/playbooks/setup.yml

    deploy-services:
      - variables:
          - name: services
            default: all
      - step: *lint-frontend
      - step: *lint-api
      - step:
          name: Deploy (targeted)
          deployment: production
          script:
            - pip install --quiet ansible
            - mkdir -p ~/.ssh
            - python3 -c 'import os,textwrap; k=os.environ["CONTABO_SSH_KEY"]; k=k.replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if "\n" not in k else k; b="-----BEGIN OPENSSH PRIVATE KEY-----"; e="-----END OPENSSH PRIVATE KEY-----"; c=k[k.index(b)+len(b):k.index(e)].strip() if b in k and e in k and k.count("\n")<=1 else None; k=b+"\n"+textwrap.fill(c,70)+"\n"+e+"\n" if c else k; k=k+"\n" if not k.endswith("\n") else k; open("/root/.ssh/id_ed25519","w").write(k); os.chmod("/root/.ssh/id_ed25519",0o600)'
            - |
              export ANSIBLE_CONFIG=ansible/ansible.cfg
              if [ "$services" = "all" ] || [ -z "$services" ]; then
                FULL_DEPLOY=true
                SVC=""
              else
                FULL_DEPLOY=false
                SVC="$services"
              fi
              WORKER_IP="$(echo "${CONTABO_WORKER_IP}" | xargs)"
              if [ -z "$WORKER_IP" ]; then
                ansible-playbook -i ansible/inventory/single.yml ansible/playbooks/deploy_main.yml \
                  -e "full_deploy=$FULL_DEPLOY" -e "services=$SVC"
              else
                bash sh_files/gen_workers_inventory.sh
                ansible-playbook -i ansible/inventory/multi/main.yml ansible/playbooks/deploy_main.yml \
                  -e "full_deploy=$FULL_DEPLOY" -e "services=$SVC"
                ansible-playbook -i ansible/inventory/multi/workers_dynamic.yml ansible/playbooks/deploy_workers.yml \
                  -e "full_deploy=$FULL_DEPLOY" -e "worker_services=$SVC"
              fi
